services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: hello-world-pe:latest
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis-svc:6379
    restart: on-failure
    depends_on:
      - redis
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
volumes:
  redis-data: