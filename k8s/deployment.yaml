apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-pe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world-pe
  template:
    metadata:
      labels:
        app: hello-world-pe
    spec:
      containers:
      - name: app
        image: hello-world-pe:latest
        ports:
        - containerPort: 3000