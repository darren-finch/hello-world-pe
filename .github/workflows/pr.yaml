on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository code
              uses: actions/checkout@v4

            - name: Install Dependencies
              run: npm install

            - name: Run Linter
              run: npm run lint

            - name: Run Tests
              run: npm run test
