on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-world-pe:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-world-pe:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Production
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config view          # shows parsed config (redacts certs)
          kubectl config current-context
          kubectl cluster-info         # shows what server it's actually trying to hit
          kubectl apply -f k8s/
          kubectl set image deployment/hello-world-pe \
            app=$DOCKERHUB_USERNAME/hello-world-pe:${{ github.sha }}
          kubectl rollout status deployment/hello-world-pe
