on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-world-pe:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-world-pe:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME,GITHUB_SHA
          script: |
            docker pull $DOCKERHUB_USERNAME/hello-world-pe:$GITHUB_SHA
            docker stop hello-world-pe || true
            docker rm hello-world-pe || true
            docker run -d --name hello-world-pe --restart=always \
                -p 80:3000 \
                $DOCKERHUB_USERNAME/hello-world-pe:$GITHUB_SHA
